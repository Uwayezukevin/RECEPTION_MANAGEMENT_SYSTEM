<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <title>RECEPTION MANAGEMENT SYSTEM</title>
    
    <!-- Minimal fallback - NO conflicting styles -->
    <style>
      /* Only essential fallback - no colors that conflict */
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      
      #root {
        min-height: 100vh;
      }
      
      .loading-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-fallback">
        <div>
          <h2>Loading Reception System</h2>
          <p>Please wait...</p>
        </div>
      </div>
    </div>
    
    <noscript>
      <div style="min-height: 100vh; background: #f0f2f5; display: flex; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: white; border-radius: 12px; padding: 30px; max-width: 400px; text-align: center;">
          <h2>JavaScript Required</h2>
          <p>Please enable JavaScript to use this application.</p>
        </div>
      </div>
    </noscript>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
