<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#3b82f6" />
    <title>RECEPTION MANAGEMENT SYSTEM</title>
    
    <!-- Simple, visible fallback styles that work on ALL phones -->
    <style>
      /* Guaranteed visible styles - no gradients, no blur */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        background: #f0f2f5 !important;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
        color: #1f2937 !important;
        min-height: 100vh;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Loading fallback - visible */
      .loading-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f0f2f5;
        color: #1f2937;
        text-align: center;
        padding: 20px;
      }
      
      /* Simple button style */
      button {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 16px;
      }
      
      /* Simple card style */
      .card {
        background: white;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-fallback">
        <div>
          <h2 style="margin: 0 0 8px 0; color: #1f2937;">Loading Reception System</h2>
          <p style="margin: 0; color: #6b7280;">Please wait...</p>
        </div>
      </div>
    </div>
    
    <noscript>
      <div style="min-height: 100vh; background: #f0f2f5; display: flex; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: white; border-radius: 12px; padding: 30px; max-width: 400px; text-align: center;">
          <h2 style="color: #1f2937; margin-bottom: 8px;">JavaScript Required</h2>
          <p style="color: #4b5563;">Please enable JavaScript to use this application.</p>
        </div>
      </div>
    </noscript>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
